<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishop Run: Extreme Survival - 5x5 Chess</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0d1b2a 0%, #1b263b 50%, #0d1117 100%);
      --board-border: #1e293b;
      --light-square: #cbd5e1;
      --dark-square: #475569;
      --highlight: #00f5d4;
      --danger: #ff0055;
      --gold: #ffd166;
      --text: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Pulsing Glow Background */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.12) 0%, transparent 70%);
      animation: ambientPulse 6s infinite alternate ease-in-out;
      z-index: 0;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1) translate(-30px, -30px); }
      100% { transform: scale(1.3) translate(30px, 30px); }
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 520px;
      width: 100%;
      z-index: 1;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ffd166, #ff0055, #00f5d4);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradient 4s ease infinite;
      margin-bottom: 4px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 12px rgba(0, 245, 212, 0.3));
    }

    @keyframes titleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--gold);
    }

    .board-wrapper {
      perspective: 1000px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .chessboard {
      width: 400px;
      height: 400px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border: 10px solid var(--board-border);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 245, 212, 0.25),
                  0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .square.light {
      background-color: var(--light-square);
    }

    .square.dark {
      background-color: var(--dark-square);
    }

    /* Valid Move Highlights */
    .square.valid-move::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--highlight);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--highlight), 0 0 25px var(--highlight);
      animation: movePulse 1.2s infinite ease-in-out;
    }

    @keyframes movePulse {
      0% { transform: scale(0.8); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.7; }
    }

    /* Animated Red Side Threats on Game Over */
    .square.blocked-top::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-bottom::before {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-left::before {
      content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-right::before {
      content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }

    @keyframes wallGlow {
      0% { opacity: 0.6; filter: drop-shadow(0 0 2px var(--danger)); }
      100% { opacity: 1; filter: drop-shadow(0 0 12px var(--danger)); }
    }

    .square.locked-square {
      background-color: rgba(255, 0, 85, 0.45) !important;
      animation: pulse-red 1.2s infinite alternate ease-in-out;
    }

    @keyframes pulse-red {
      0% { box-shadow: inset 0 0 15px var(--danger); }
      100% { box-shadow: inset 0 0 35px var(--danger); }
    }

    .piece {
      width: 80%;
      height: 80%;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.5));
    }

    .piece svg {
      width: 100%;
      height: 100%;
    }

    /* Game Over Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-card h2 {
      font-size: 2.2rem;
      color: var(--danger);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-card p {
      color: #cbd5e1;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .rank-badge {
      display: inline-block;
      margin: 15px 0;
      padding: 8px 18px;
      background: linear-gradient(135deg, #ffd166, #ff0055);
      color: #000;
      font-weight: 800;
      border-radius: 20px;
      font-size: 1.1rem;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
    }

    .btn {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 245, 212, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 245, 212, 0.6);
    }

    @media (max-width: 440px) {
      .chessboard {
        width: 320px;
        height: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>Bishop Run</h1>
      <div class="subtitle">Escape 2 Rooks & 1 Knight on a 5x5 Board</div>
    </header>

    <div class="hud">
      <div class="stat-box">
        <span class="stat-label">Turn</span>
        <span class="stat-value" id="turn-indicator">Bishop</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Escapes</span>
        <span class="stat-value" id="score-display">0</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="chessboard" id="board"></div>
    </div>
  </div>

  <div class="modal-overlay" id="game-over-modal">
    <div class="modal-card">
      <h2>Captured!</h2>
      <p>The Bishop has been cornered.</p>
      <p>Total Escapes: <strong id="final-score" style="color:var(--gold)">0</strong></p>
      <div>
        <span class="rank-badge" id="rank-display">Rank: Novice</span>
      </div>
      <button class="btn" onclick="initGame()">Try Again</button>
    </div>
  </div>

  <script>
    // --- Custom SVGs ---
    const BISHOP_SVG = `
      <div class="piece" id="bishop">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <g fill="#ffffff" stroke="#000000">
              <path d="M 9,36 C 12.39,35.03 19.11,36.46 22.5,34 C 25.89,36.46 32.61,35.03 36,36 C 36,36 37.65,36.54 39,38 C 38.32,38.97 37.35,38.99 36,38.5 C 32.61,37.53 25.89,38.96 22.5,37.5 C 19.11,38.96 12.39,37.53 9,38.5 C 7.646,38.99 6.677,38.97 6,38 C 7.354,36.54 9,36 9,36 z"/>
              <path d="M 15,32 C 17.5,34.5 27.5,34.5 30,32 C 30.5,30.5 30,28.5 29,27 C 26,27 25.5,23.5 24.5,21 C 24.5,19.5 25.5,18 25.5,16 C 25.5,13.5 23,10.5 22.5,10 C 22,10.5 19.5,13.5 19.5,16 C 19.5,18 20.5,19.5 20.5,21 C 19.5,23.5 19,27 16,27 C 15,28.5 14.5,30.5 15,32 z"/>
              <path d="M 25 8 A 2.5 2.5 0 1 1  20,8 A 2.5 2.5 0 1 1  25 8 z"/>
            </g>
            <path d="M 17.5,26 L 27.5,26 M 15,30 L 30,30 M 22.5,15.5 L 22.5,20.5 M 20,18 L 25,18" stroke="#000" fill="none"/>
          </g>
        </svg>
      </div>`;

    const ROOK_SVG = `
      <div class="piece">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 9,39 L 36,39 L 36,36 L 9,36 L 9,39 z" fill="#111111" stroke="#000000" />
            <path d="M 12,36 L 12,32 L 33,32 L 33,36 L 12,36 z" fill="#111111" stroke="#000000" />
            <path d="M 11,14 L 11,9 L 15,9 L 15,11 L 20,11 L 20,9 L 25,9 L 25,11 L 30,11 L 30,9 L 34,9 L 34,14 L 31,17 L 31,29.5 L 14,29.5 L 14,17 L 11,14 z" fill="#111111" stroke="#000000" />
            <path d="M 12,14 L 33,14" stroke="#ffffff" />
            <path d="M 14,29.5 L 31,29.5" stroke="#ffffff" />
            <path d="M 14,16.5 L 31,16.5" stroke="#ffffff" />
            <path d="M 11,14 L 34,14" stroke="#000000" />
          </g>
        </svg>
      </div>`;

    const KNIGHT_SVG = `
      <div class="piece">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 20,25 22,10 z" fill="#111111" />
            <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,26.52 10,26 C 9,25.5 8.35,24.8 9,24 C 9.65,23.2 10.58,23.11 11,22 C 11.42,20.89 10.36,19.34 12,18 C 13.64,16.66 18.25,13.88 19,10 C 19.5,10 23,10 24,18 z" fill="#111111" />
            <path d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5,25.5 A 0.5 0.5 0 1 1 9.5 25.5 z" stroke="#ffffff" />
            <path d="M 15 15.5 A 0.5 1.5 0 1 1 14,15.5 A 0.5 1.5 0 1 1 15 15.5 z" transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)" stroke="#ffffff" />
          </g>
        </svg>
      </div>`;

    const RANK_TITLES = [
      "Escaped Pawn", "Agile Cleric", "Diagonal Dodger", 
      "Grandmaster Trapper", "Phantom Bishop", "Sly Tactician",
      "Shadow Dancer", "Board Architect", "Unreachable Cleric"
    ];

    const RANK_ADJECTIVES = [
      "Unbelievable", "Godlike", "Calculated", "Smooth", 
      "Illusive", "Masterful", "Legendary", "Slick"
    ];

    // Position State (0-indexed)
    let bishopPos = { r: 0, c: 0 };
    let rook1Pos = { r: 0, c: 0 }; // (1,1) -> 0,0
    let rook2Pos = { r: 1, c: 0 }; // (2,1) -> 1,0
    let knightPos = { r: 0, c: 4 }; // (1,5) -> 0,4
    
    let score = 0;
    let isPlayerTurn = true;
    let selectedMoves = [];
    let isGameOver = false;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score-display');
    const turnEl = document.getElementById('turn-indicator');
    const modalEl = document.getElementById('game-over-modal');

    function initGame() {
      score = 0;
      isPlayerTurn = true;
      isGameOver = false;
      scoreEl.textContent = score;
      turnEl.textContent = "Bishop";
      turnEl.style.color = "var(--gold)";
      modalEl.classList.remove('active');

      // Fixed positions: (1,1)->[0,0], (2,1)->[1,0], (1,5)->[0,4]
      rook1Pos = { r: 0, c: 0 };
      rook2Pos = { r: 1, c: 0 };
      knightPos = { r: 0, c: 4 };

      // Spawn Bishop randomly on open tile
      let r, c;
      do {
        r = Math.floor(Math.random() * 5);
        c = Math.floor(Math.random() * 5);
      } while (
        (r === 0 && c === 0) || 
        (r === 1 && c === 0) || 
        (r === 0 && c === 4)
      );

      bishopPos = { r, c };

      renderBoard();
      highlightValidMoves();
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;

          if (r === bishopPos.r && c === bishopPos.c) {
            square.innerHTML = BISHOP_SVG;
          } else if (r === rook1Pos.r && c === rook1Pos.c) {
            square.innerHTML = ROOK_SVG;
          } else if (r === rook2Pos.r && c === rook2Pos.c) {
            square.innerHTML = ROOK_SVG;
          } else if (r === knightPos.r && c === knightPos.c) {
            square.innerHTML = KNIGHT_SVG;
          }

          square.addEventListener('click', () => handleSquareClick(r, c));
          boardEl.appendChild(square);
        }
      }
    }

    function getBishopMoves(pos) {
      const moves = [];
      const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      for (let [dr, dc] of directions) {
        let nr = pos.r + dr;
        let nc = pos.c + dc;
        while (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
          // Blocked by Rooks or Knight
          if ((nr === rook1Pos.r && nc === rook1Pos.c) || 
              (nr === rook2Pos.r && nc === rook2Pos.c) ||
              (nr === knightPos.r && nc === knightPos.c)) {
            break;
          }
          moves.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }
      }
      return moves;
    }

    function isSquareAttackedByEnemies(r, c, r1 = rook1Pos, r2 = rook2Pos, kn = knightPos) {
      // 1. Check Rooks' straight line threat
      if (r1.r === r || r1.c === c) return true;
      if (r2.r === r || r2.c === c) return true;

      // 2. Check Knight's L-shaped attack jumps
      const knightOffsets = [
        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
        [1, -2], [1, 2], [2, -1], [2, 1]
      ];
      for (let [dr, dc] of knightOffsets) {
        if (kn.r + dr === r && kn.c + dc === c) return true;
      }

      return false;
    }

    function highlightValidMoves() {
      clearHighlights();
      if (!isPlayerTurn || isGameOver) return;

      selectedMoves = getBishopMoves(bishopPos);
      const safeMoves = selectedMoves.filter(m => !isSquareAttackedByEnemies(m.r, m.c));

      if (selectedMoves.length === 0 || safeMoves.length === 0) {
        endGame();
        return;
      }

      selectedMoves.forEach(m => {
        const sq = getSquareEl(m.r, m.c);
        if (sq) sq.classList.add('valid-move');
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('valid-move');
      });
    }

    function handleSquareClick(r, c) {
      if (!isPlayerTurn || isGameOver) return;

      const isValid = selectedMoves.some(m => m.r === r && m.c === c);
      if (!isValid) return;

      bishopPos = { r, c };
      score++;
      scoreEl.textContent = score;
      renderBoard();

      if (isSquareAttackedByEnemies(bishopPos.r, bishopPos.c)) {
        endGame();
        return;
      }

      isPlayerTurn = false;
      turnEl.textContent = "AI (Enemies)";
      turnEl.style.color = "var(--danger)";
      clearHighlights();

      setTimeout(makeComputerMove, 500);
    }

    function makeComputerMove() {
      if (isGameOver) return;

      const allEnemyMoves = [];

      // Rook 1 legal moves
      getRookMoves(rook1Pos, rook2Pos, knightPos).forEach(m => {
        allEnemyMoves.push({ type: 'r1', from: rook1Pos, to: m });
      });

      // Rook 2 legal moves
      getRookMoves(rook2Pos, rook1Pos, knightPos).forEach(m => {
        allEnemyMoves.push({ type: 'r2', from: rook2Pos, to: m });
      });

      // Knight legal moves
      getKnightMoves(knightPos, rook1Pos, rook2Pos).forEach(m => {
        allEnemyMoves.push({ type: 'kn', from: knightPos, to: m });
      });

      let bestMove = null;
      let minBishopEscapeMoves = Infinity;

      for (let move of allEnemyMoves) {
        let simR1 = move.type === 'r1' ? move.to : rook1Pos;
        let simR2 = move.type === 'r2' ? move.to : rook2Pos;
        let simKN = move.type === 'kn' ? move.to : knightPos;

        // Priority 1: Immediate Capture
        if ((simR1.r === bishopPos.r && simR1.c === bishopPos.c) || 
            (simR2.r === bishopPos.r && simR2.c === bishopPos.c) ||
            (simKN.r === bishopPos.r && simKN.c === bishopPos.c)) {
          bestMove = move;
          break;
        }

        // Minimax heuristic: Minimize remaining safe moves for Bishop
        const futureBishopMoves = getBishopMoves(bishopPos).filter(
          m => !isSquareAttackedByEnemies(m.r, m.c, simR1, simR2, simKN)
        );

        if (futureBishopMoves.length < minBishopEscapeMoves) {
          minBishopEscapeMoves = futureBishopMoves.length;
          bestMove = move;
        }
      }

      // Execute Best AI Move
      if (bestMove) {
        if (bestMove.type === 'r1') rook1Pos = bestMove.to;
        else if (bestMove.type === 'r2') rook2Pos = bestMove.to;
        else if (bestMove.type === 'kn') knightPos = bestMove.to;
      }

      renderBoard();

      const currentSafeMoves = getBishopMoves(bishopPos).filter(
        m => !isSquareAttackedByEnemies(m.r, m.c)
      );

      if (isSquareAttackedByEnemies(bishopPos.r, bishopPos.c) || currentSafeMoves.length === 0) {
        endGame();
      } else {
        isPlayerTurn = true;
        turnEl.textContent = "Bishop";
        turnEl.style.color = "var(--gold)";
        highlightValidMoves();
      }
    }

    function getRookMoves(rook, otherRook, knight) {
      const moves = [];
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      for (let [dr, dc] of dirs) {
        let nr = rook.r + dr;
        let nc = rook.c + dc;
        while (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
          if ((nr === otherRook.r && nc === otherRook.c) || (nr === knight.r && nc === knight.c)) break;
          moves.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }
      }
      return moves;
    }

    function getKnightMoves(knight, r1, r2) {
      const moves = [];
      const offsets = [
        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
        [1, -2], [1, 2], [2, -1], [2, 1]
      ];

      for (let [dr, dc] of offsets) {
        let nr = knight.r + dr;
        let nc = knight.c + dc;
        if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
          if ((nr === r1.r && nc === r1.c) || (nr === r2.r && nc === r2.c)) continue;
          moves.push({ r: nr, c: nc });
        }
      }
      return moves;
    }

    function getSquareEl(r, c) {
      return document.querySelector(`.square[data-row="${r}"][data-col="${c}"]`);
    }

    function endGame() {
      if (isGameOver) return;
      isGameOver = true;
      turnEl.textContent = "Locked!";
      turnEl.style.color = "var(--danger)";

      showBlockedDirections();

      // Pause for exactly 5 seconds displaying danger highlight on board before showing modal
      setTimeout(() => {
        document.getElementById('final-score').textContent = score;
        const title = RANK_TITLES[Math.floor(Math.random() * RANK_TITLES.length)];
        const adj = RANK_ADJECTIVES[Math.floor(Math.random() * RANK_ADJECTIVES.length)];
        document.getElementById('rank-display').textContent = `Rank: ${adj} ${title}`;
        modalEl.classList.add('active');
      }, 5000);
    }

    function showBlockedDirections() {
      const bSq = getSquareEl(bishopPos.r, bishopPos.c);
      if (bSq) bSq.classList.add('locked-square');

      const possibleBishopDirections = [
        { dr: -1, dc: -1, top: true, left: true },
        { dr: -1, dc: 1,  top: true, right: true },
        { dr: 1,  dc: -1, bottom: true, left: true },
        { dr: 1,  dc: 1,  bottom: true, right: true }
      ];

      possibleBishopDirections.forEach(dir => {
        let targetR = bishopPos.r + dir.dr;
        let targetC = bishopPos.c + dir.dc;

        if (
          targetR < 0 || targetR >= 5 || 
          targetC < 0 || targetC >= 5 || 
          isSquareAttackedByEnemies(targetR, targetC)
        ) {
          if (bSq) {
            if (dir.top) bSq.classList.add('blocked-top');
            if (dir.bottom) bSq.classList.add('blocked-bottom');
            if (dir.left) bSq.classList.add('blocked-left');
            if (dir.right) bSq.classList.add('blocked-right');
          }
        }
      });
    }

    initGame();
  </script>
